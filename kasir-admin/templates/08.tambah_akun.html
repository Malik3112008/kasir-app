{% from 'macros.html' import admin_header %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Akun</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='08.pengelola_akun_penjual.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
</head>
<body>
    {{ admin_header('Tambah Akun') }}

<div class="form-container">

    <h1>Tambah Akun</h1>

    <form method="POST">
        <input type="text" name="nama" placeholder="Nama" required>
        <input type="email" name="email" placeholder="Email" required>
        <select name="status">
            <option>Aktif</option>
            <option>Tidak aktif</option>
        </select>
        <button type="submit">Simpan</button>
    </form>

    <a href="{{ url_for('admin_kelola_akun_penjual') }}" class="btn-kembali">Kembali</a>

</div>

</body>
</html>
