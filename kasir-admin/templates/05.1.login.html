<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='05.login_admin.css') }}">
    <title>Masuk Admin Koperasi</title>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-image">
                <img src="{{ url_for('static', filename='image/logo_3.png') }}" alt="Logo Koperasi" class="login-logo">
                <h3>Masuk Admin {{ nama_koperasi }}</h3>
                <p class="card-description">Kelola data koperasi dan pantau transaksi siswa dengan aman.</p>
            </div>
            <div class="card-form">
                <a href="{{ url_for('admin_beranda_awal') }}" class="back-btn">&larr; Kembali</a>
                {% if error %}
                <div class="error-message">{{ error }}</div>
                {% endif %}
                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="input-group">
                        <label>Nama akun</label>
                        <input type="text" name="username" placeholder="Masukkan nama akun" required oninvalid="this.setCustomValidity('Silakan isi kolom ini')" oninput="this.setCustomValidity('')">
                    </div>
                    <div class="input-group">
                        <label>Kata sandi</label>
                        <div class="password-field" style="position: relative;">
                            <input type="password" name="password" placeholder="Masukkan kata sandi" required oninvalid="this.setCustomValidity('Silakan isi kolom ini')" oninput="this.setCustomValidity('')" style="width: 100%; padding-right: 40px;">
                            <span class="eye-icon" onclick="togglePassword(this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="eye-closed" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Masuk</button>
                </form>
            </div>
        </div>
    </div>
    <script>
    function togglePassword(el) {
        var input = el.parentElement.querySelector('input');
        var eyeOpen = el.querySelector('.eye-open');
        var eyeClosed = el.querySelector('.eye-closed');
        
        if (input.type === 'password') {
            input.type = 'text';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'block';
        } else {
            input.type = 'password';
            eyeOpen.style.display = 'block';
            eyeClosed.style.display = 'none';
        }
    }
    </script>
</body>
</html>
