{% macro admin_header(title="Admin Koperasi", back_url=None) %}
{% set back_link = back_url if back_url else url_for('admin.admin_dashboard') %}
<nav style="background-color: #ffffff !important; box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important; display: flex !important; justify-content: space-between !important; align-items: center !important; padding: 10px 20px !important; min-height: 80px !important; border-radius: 10px !important; margin-bottom: 20px !important;">

    <div class="nav-bar" style="display: flex; align-items: center; width: 100%;">
        <div class="nav-left" style="display: flex; align-items: center; gap: 20px;">
            <a href="{{ back_link }}" style="display: flex; align-items: center;">
                <img src="{{ url_for('static', filename='back-svgrepo-com.svg') }}" alt="Kembali" width="30px" height="30px">
            </a>
            <div class="header-content" style="display: flex; align-items: center; gap: 15px;">
                <img src="{{ url_for('static', filename='image/logo_3.png') }}" alt="Logo" width="60" height="60" style="object-fit: contain;">
                <span class="header-text" style="font-weight: 700; font-size: 22px; color: #333; white-space: nowrap;">Koperasi Siswa</span>
            </div>
        </div>
    </div>
    <ul style="display: flex; list-style: none; align-items: center; gap: 20px; margin: 0; padding: 0;">
        <li style="position: relative;">
            <a href="{{ url_for('admin.admin_notifikasi') }}" style="position: relative; display: inline-block;">
                <img src="{{ url_for('static', filename='bell-notification-ui-svgrepo.svg') }}" alt="Notifikasi" width="28px" height="28px">
                {% if notif_count > 0 %}
                <span style="position: absolute; top: -5px; right: -5px; background: #e53e3e; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid white;">
                    {{ notif_count }}
                </span>
                {% endif %}
            </a>
        </li>
        <li><a href="{{ url_for('admin.admin_pengaturan') }}"><img src="{{ url_for('static', filename='setting-svgrepo.svg') }}" alt="Setting" width="28px" height="28px"></a></li>
        <li><a href="{{ url_for('admin.admin_kelola_akun_penjual') }}"><img src="{{ url_for('static', filename='profile-circle-svgrepo.svg') }}" alt="Pengguna" width="28px" height="28px"></a></li>
        <li><a href="{{ url_for('admin.admin_logout') }}"><img src="{{ url_for('static', filename='logout-line-svgrepo.svg') }}" alt="Keluar" width="28px" height="28px"></a></li>
    </ul>

</nav>
{% endmacro %}
