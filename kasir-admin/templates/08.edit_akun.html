{% from 'macros.html' import admin_header %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Akun</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='08.pengelola_akun_penjual.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
</head>
<body>
    {{ admin_header('Edit Akun') }}

<div class="form-container">

    <h1>Edit Akun</h1>

    <form method="POST">
        <input type="text" name="nama" value="{{ akun.nama }}" placeholder="Nama" required>
        <input type="email" name="email" value="{{ akun.email }}" placeholder="Email" required>
        <select name="status">
            <option {% if akun.status == 'Aktif' %}selected{% endif %}>Aktif</option>
            <option {% if akun.status == 'Tidak aktif' %}selected{% endif %}>Tidak aktif</option>
        </select>
        <button type="submit">Update</button>
    </form>

    <a href="{{ url_for('admin_kelola_akun_penjual') }}" class="btn-kembali">Kembali</a>

</div>

</body>
</html>
