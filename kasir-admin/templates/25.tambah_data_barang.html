{% from 'macros.html' import admin_header %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Barang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='25-tambah-data-barang.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/id.js"></script>
</head>
<body>

    {{ admin_header('Tambah Data Barang') }}

    <div class="container">

        <h1>TAMBAH DATA BARANG</h1>

        <form action="{{ url_for('admin.admin_simpan_barang_baru') }}" method="POST" enctype="multipart/form-data">

            <div class="input-group">
                <label>Pilih Kategori</label>
                <select name="kategori" required>
                    <option value="">Pilih Kategori</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Alat Tulis">Alat Tulis</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nama Barang</label>
                <input type="text" name="nama_barang" placeholder="Masukkan nama barang" required>
            </div>

            <div class="input-group">
                <label>Detail Produk</label>
                <div class="detail-box">
                    <div class="detail-item">
                        <span>Merek :</span>
                        <input type="text" name="variasi" placeholder="Contoh: Aqua, Le Minerale">
                    </div>
                    <div class="detail-item">
                        <span>Volume :</span>
                        <input type="text" name="volume" placeholder="Contoh: 600 ml">
                    </div>
                    <div class="detail-item">
                        <span>Rasa :</span>
                        <input type="text" name="rasa" placeholder="Contoh: Cokelat">
                    </div>
                    <div class="detail-item">
                        <span>Expired :</span>
                        <input type="text" name="expired" placeholder="Contoh: April-2028">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Deskripsi</label>
                <details class="deskripsi-box">
                    <summary>Klik untuk menulis deskripsi</summary>
                    <textarea name="deskripsi" rows="4" placeholder="Tulis deskripsi barang..."></textarea>
                </details>
            </div>

            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <label>Harga Beli</label>
                        <input type="number" name="harga_beli" min="1" step="1" placeholder="3000" required>
                    </div>
                </div>
                <div class="col">
                    <div class="input-group">
                        <label>Harga Jual</label>
                        <input type="number" name="harga_jual" min="1" step="1" placeholder="4000" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <label>Jumlah</label>
                        <input type="number" name="jumlah" min="1" step="1" placeholder="35" required>
                    </div>
                </div>
                <div class="col">
                    <div class="input-group">
                        <label>Tanggal</label>
                        <input type="date" name="tanggal" placeholder="dd/mm/yyyy" required>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Gambar</label>
                <input type="file" name="gambar" accept="image/*" id="input-gambar">
                <div class="preview-container" id="preview-container" style="display: none; margin-top: 15px; text-align: center;">
                    <p style="font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px;">Pratinjau Gambar:</p>
                    <img id="img-preview" src="#" alt="Pratinjau" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 1px solid #ddd; object-fit: contain; padding: 5px; background: #fff;">
                </div>
            </div>

            <button type="submit" class="btn-simpan">Simpan Barang</button>

        </form>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            flatpickr("input[type=date]", {
                locale: "id",
                altInput: true,
                altFormat: "d-m-Y",
                dateFormat: "Y-m-d"
            });

            const inputGambar = document.getElementById('input-gambar');
            if (inputGambar) {
                inputGambar.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    const container = document.getElementById('preview-container');
                    const preview = document.getElementById('img-preview');
                    
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            preview.src = ev.target.result;
                            container.style.display = 'block';
                        };
                        reader.readAsDataURL(file);
                    } else {
                        preview.src = '#';
                        container.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
