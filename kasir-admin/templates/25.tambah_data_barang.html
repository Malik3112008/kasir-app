<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Barang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='25-tambah-data-barang.css') }}">
</head>
<body>

    <nav>
        <div class="nav-bar">
            <li>
                <a href="{{ url_for('admin_dashboard') }}"><img src="{{ url_for('static', filename='back-svgrepo-com.svg') }}" alt="Kembali" width="30px" height="30px"></a>
            </li>
            <img src="{{ url_for('static', filename='logo_3.png') }}" alt="Logo" width="70" height="70">
            <span>Admin Koperasi</span>
        </div>
        <ul>
            <li><a href="{{ url_for('admin_notifikasi') }}"><img src="{{ url_for('static', filename='bell-notification-ui-svgrepo.svg') }}" alt="Notifikasi" width="30px" height="30px"></a></li>
            <li><a href="{{ url_for('admin_pengaturan') }}"><img src="{{ url_for('static', filename='setting-svgrepo.svg') }}" alt="Setting" width="30px" height="30px"></a></li>
            <li><a href="{{ url_for('admin_kelola_akun_penjual') }}"><img src="{{ url_for('static', filename='profile-circle-svgrepo.svg') }}" alt="Pengguna" width="30px" height="30px"></a></li>
            <li><a href="{{ url_for('admin_logout') }}"><img src="{{ url_for('static', filename='logout-line-svgrepo.svg') }}" alt="Keluar" width="30px" height="30px"></a></li>
        </ul>
    </nav>

    <div class="container">

        <h1>TAMBAH DATA BARANG</h1>

        <form action="{{ url_for('admin_simpan_barang_baru') }}" method="POST" enctype="multipart/form-data">

            <div class="input-group">
                <label>Pilih Kategori</label>
                <select name="kategori" required>
                    <option value="">Pilih Kategori</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Alat Tulis">Alat Tulis</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nama Barang</label>
                <input type="text" name="nama_barang" placeholder="Masukkan nama barang" required>
            </div>

            <div class="input-group">
                <label>Detail Produk</label>
                <div class="detail-box">
                    <div class="detail-item">
                        <span>Variasi :</span>
                        <input type="text" name="variasi" placeholder="Contoh: Original">
                    </div>
                    <div class="detail-item">
                        <span>Volume :</span>
                        <input type="text" name="volume" placeholder="Contoh: 600 ml">
                    </div>
                    <div class="detail-item">
                        <span>Rasa :</span>
                        <input type="text" name="rasa" placeholder="Contoh: Cokelat">
                    </div>
                    <div class="detail-item">
                        <span>Expired :</span>
                        <input type="text" name="expired" placeholder="Contoh: April-2028">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Deskripsi</label>
                <details class="deskripsi-box">
                    <summary>Klik untuk menulis deskripsi</summary>
                    <textarea name="deskripsi" rows="4" placeholder="Tulis deskripsi barang..."></textarea>
                </details>
            </div>

            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <label>Harga Beli</label>
                        <input type="number" name="harga_beli" min="1" step="1" placeholder="3000" required>
                    </div>
                </div>
                <div class="col">
                    <div class="input-group">
                        <label>Harga Jual</label>
                        <input type="number" name="harga_jual" min="1" step="1" placeholder="4000" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <label>Jumlah</label>
                        <input type="number" name="jumlah" min="1" step="1" placeholder="35" required>
                    </div>
                </div>
                <div class="col">
                    <div class="input-group">
                        <label>Tanggal</label>
                        <input type="date" name="tanggal" required>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Gambar</label>
                <input type="file" name="gambar" accept="image/*">
            </div>

            <button type="submit" class="btn-simpan">Simpan Barang</button>

        </form>

    </div>

</body>
</html>
