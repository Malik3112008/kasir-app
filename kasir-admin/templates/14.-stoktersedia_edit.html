<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Barang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='14.-stoktersedia_edit.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/id.js"></script>
</head>
<body>

<nav>
    <div class="nav-bar">
        <li>
            <a href="{{ url_for('admin_stok_tersedia') }}"><img src="{{ url_for('static', filename='back-svgrepo-com.svg') }}" alt="Kembali" width="30px" height="30px"></a>
        </li>
        <img src="{{ url_for('static', filename='image/logo_3.png') }}" alt="Logo" width="50" height="50">
        <span>{{ nama_koperasi }}</span>
    </div>
    <ul>
        <li><a href="{{ url_for('admin_notifikasi') }}"><img src="{{ url_for('static', filename='bell-notification-ui-svgrepo.svg') }}" alt="Notifikasi" width="25px" height="25px"></a></li>
        <li><a href="{{ url_for('admin_pengaturan') }}"><img src="{{ url_for('static', filename='setting-svgrepo.svg') }}" alt="Setting" width="25px" height="25px"></a></li>
        <li><a href="{{ url_for('admin_kelola_akun_penjual') }}"><img src="{{ url_for('static', filename='profile-circle-svgrepo.svg') }}" alt="Pengguna" width="25px" height="25px"></a></li>
        <li><a href="{{ url_for('admin_logout') }}"><img src="{{ url_for('static', filename='logout-line-svgrepo.svg') }}" alt="Keluar" width="25px" height="25px"></a></li>
    </ul>
</nav>

<h2 class="edit-title">Edit Barang</h2>

<div class="form-card">
    <div class="nama-barang-box">
        Nama Barang : {{ barang.nama }}
    </div>

    <form action="/admin/stok-tersedia/edit/{{ barang.no }}" method="POST">
        <input type="hidden" name="nama" value="{{ barang.nama }}">
        <input type="hidden" name="kategori" value="{{ barang.kategori }}">

        <div class="form-group">
            <label>Stok</label>
            <input type="number" name="stok" value="{{ barang.stok }}" required>
        </div>

        <div class="form-group">
            <label>Harga</label>
            <input type="number" name="harga" value="{{ barang.harga }}" required>
        </div>

        <div class="form-group">
            <label>Berat</label>
            <input type="text" name="berat" value="{{ barang.berat }}">
        </div>

        <div class="form-group">
            <label>Satuan</label>
            <input type="text" name="satuan" value="{{ barang.satuan if barang.satuan else '' }}" placeholder="Contoh: gr, kg, ml">
        </div>

        <div class="form-group">
            <label>Tanggal Restok</label>
            <input type="date" id="tanggal_restok" name="tanggal_restok" value="{{ barang.tanggal_restok if barang.tanggal_restok else '' }}" placeholder="dd/mm/yyyy">
        </div>

        <div class="form-group">
            <label>Expired</label>
            <input type="text" name="expired" value="{{ barang.expired if barang.expired else '' }}" placeholder="Contoh: Mei 2028">
        </div>

        <div class="form-group">
            <label>Alasan Perubahan</label>
            <textarea name="alasan" placeholder="Masukkan alasan perubahan jika ada">{{ barang.alasan if barang.alasan else '' }}</textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">Simpan Perubahan</button>
            <a href="{{ url_for('admin_stok_tersedia') }}" class="btn-cancel">Batal</a>
        </div>
    </form>
</div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            flatpickr("#tanggal_restok", {
                locale: "id",
                altInput: true,
                altFormat: "d-m-Y",
                dateFormat: "Y-m-d"
            });
        });
    </script>
</body>
</html>
