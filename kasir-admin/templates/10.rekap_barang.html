<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Rekap Barang</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='10.pengisian_barang_habis.css') }}">
</head>
<body>
    <nav>
        <div class="nav-bar">
            <li>
                <a href="{{ url_for('admin.admin_dashboard') }}"><img src="{{ url_for('static', filename='back-svgrepo-com.svg') }}" alt="Kembali" width="30px" height="30px"></a>
            </li>
            <img src="{{ url_for('static', filename='image/logo_3.png') }}" alt="Logo" width="70" height="70">
            <span>Koperasi Siswa</span>
        </div>
        <ul>
            <li style="position: relative; display: inline-flex; align-items: center;">
                <a href="{{ url_for('admin.admin_notifikasi') }}" style="position: relative; display: inline-flex; align-items: center; justify-content: center;">
                    <img src="{{ url_for('static', filename='bell-notification-ui-svgrepo.svg') }}" alt="Notifikasi" width="30px" height="30px">
                    {% if notif_count > 0 %}
                    <span style="position: absolute; top: -5px; right: -5px; background: #e53e3e; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid white;">
                        {{ notif_count }}
                    </span>
                    {% endif %}
                </a>
            </li>
            <li><a href="{{ url_for('admin.admin_pengaturan') }}"><img src="{{ url_for('static', filename='setting-svgrepo.svg') }}" alt="Setting" width="30px" height="30px"></a></li>
            <li><a href="{{ url_for('admin.admin_kelola_akun_penjual') }}"><img src="{{ url_for('static', filename='profile-circle-svgrepo.svg') }}" alt="Pengguna" width="30px" height="30px"></a></li>
            <li><a href="{{ url_for('admin.admin_logout') }}"><img src="{{ url_for('static', filename='logout-line-svgrepo.svg') }}" alt="Keluar" width="30px" height="30px"></a></li>
        </ul>
    </nav>

<div class="container">

    <div class="card">

        {% if restok_id %}
        <a href="{{ url_for('admin.admin_pengisian_barang_restok', id=restok_id) }}">← Kembali</a>
        {% else %}
        <a href="{{ url_for('admin.admin_pengisian_barang') }}">← Kembali</a>
        {% endif %}

        <h2>REKAP BARANG HABIS</h2>

        <label>Kategori</label>
        <input type="text" value="{{ kategori }}" readonly>

        <label>Nama Barang</label>
        <input type="text" value="{{ nama_barang }}" readonly>

        <label>Jumlah</label>
        <input type="text" value="{{ jumlah }}" readonly>

        <label>Harga</label>
        <input type="text" value="{{ harga }}" readonly>

        <a href="{{ url_for('admin.admin_manajemen_barang') }}">
            <button type="button" style="margin-top:16px; padding:12px 28px; background:#3A82C4; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">Selesai</button>
        </a>

    </div>

</div>

</body>
</html>
