<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Pembayaran</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='global-fix.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='34-yunirohmawati.css') }}">
</head>
<body>

<a href="{{ url_for('pembeli.pembeli_keranjang') }}" class="kembali">← Kembali</a>

<div class="container">

    <div class="card">
        <div class="judul">Pesanan Anda</div>
        {% for item in items %}
        <div class="produk">
            {% if item.gambar %}
            <img src="{{ url_for('static', filename=item.gambar) }}" alt="{{ item.nama }}" style="width:50px; height:50px; object-fit:contain; border-radius:8px;">
            {% endif %}
            <div>
                <h3>{{ item.nama }}</h3>
                <p>{{ formatRp(item.harga) }} x {{ item.qty }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="card">
        <div class="judul">Metode Pembayaran</div>

        <form id="paymentForm">

            <div class="metode-group">
                <button type="button" class="metode-btn" data-value="tunai" onclick="pilihMetode(this)">
                    💵 Tunai
                </button>
                <button type="button" class="metode-btn" data-value="qris" onclick="pilihMetode(this)">
                    📱 QRIS
                </button>
            </div>

            <input type="hidden" name="metode" id="metodeInput" value="">

            <div class="total">
                Total : {{ formatRp(total) }}
            </div>

            <button type="submit" class="btn-next">
                Selanjutnya
            </button>

        </form>

    </div>

</div>

<script>
const tunaiUrl = "{{ url_for('pembeli.pembeli_tunai') }}";
const qrisUrl = "{{ url_for('pembeli.pembeli_qris') }}";

function pilihMetode(btn) {
    document.querySelectorAll('.metode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('metodeInput').value = btn.dataset.value;
}

document.getElementById("paymentForm").addEventListener("submit", function(e) {
    e.preventDefault();
    let metode = document.getElementById('metodeInput').value;
    if (!metode) {
        alert("Pilih metode pembayaran dulu!");
        return;
    }
    if (metode === "tunai") {
        window.location.href = tunaiUrl;
    } else if (metode === "qris") {
        window.location.href = qrisUrl;
    }
});
</script>

</body>
</html>
